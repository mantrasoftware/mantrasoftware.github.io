<style>
:root{--bg:#101416;--surface:#171d20;--line:#2a3438;--fg:#e9ecea;--muted:#97a3a2;--amber:#f2a93b;--teal:#3fc2b5;--on:#121212;--f-d:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--f-b:"Instrument Sans",system-ui,sans-serif;--f-m:"Share Tech Mono",ui-monospace,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3efe6;--surface:#fbf8f2;--line:#ddd4c3;--fg:#1b2022;--muted:#5d6563;--amber:#b8700f;--teal:#14897e;--on:#fff;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-b)}
.w{max-width:960px;margin:0 auto;padding:0 20px}a{color:inherit}
header{border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{font:900 24px var(--f-d);text-transform:uppercase;text-decoration:none}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:13px var(--f-m);padding:6px 9px;cursor:pointer}.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
h1,h2{font-family:var(--f-d);text-transform:uppercase;line-height:.95;margin:0}
h1{font-size:clamp(40px,8vw,72px);margin:40px 0 8px}.sub{color:var(--muted);font-size:20px;margin:0 0 32px}
h2{font-size:36px;margin:0 0 14px}h2 span{color:var(--teal)}.mfb h2 span{color:var(--amber)}
section{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:24px;margin:0 0 24px}
ul{padding-left:20px;margin:0 0 14px}li{margin:0 0 8px}.tm{font:14px var(--f-m);color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-block;padding:10px 16px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-weight:600}
.btn.p{background:var(--teal);color:var(--on);border-color:transparent}.mfb .btn.p{background:var(--amber)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
figure{margin:0}figure img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);display:block}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.note{color:var(--muted);font-size:14px;margin:24px 0 48px}
</style></head><body>

<script>
const T={"it": {"t": "Novità della 2.0 Alpha", "s": "La partita intera, quarto per quarto.", "back": "Torna al sito", "dl": "Scarica", "g": "Guida d'uso", "note": "Versione alpha: tieni una copia dei tuoi progetti. Domande e segnalazioni nelle Discussions di GitHub.", "f1": ["<b>Partita intera con Mantra for Basket.</b> Apri Mantra 360 dall'HUB e lavori quarto per quarto, con un cruscotto che mostra lo stato di ognuno.", "<b>Preparazione guidata in 6 passi:</b> area di gioco, campo, inquadrature, tabellone, quarti e avvio, in una sola finestra.", "<b>File della camera (.insv) letti direttamente.</b> Serve una scheda video NVIDIA; gli MP4 si lavorano anche con altre schede, più lentamente.", "<b>Un solo passaggio per quarto:</b> video di lavoro, video del tabellone e analisi insieme. Si può interrompere e riprendere; c'è anche il lavoro di notte.", "<b>Editor per parti:</b> ti muovi tra le situazioni con i tasti e lo zoom sulla parte.", "<b>Esportazione HD</b> con tre domande, mosso della camera facoltativo, time out tagliati, e <b>Esporta tutti i quarti</b> con un pulsante.", "<b>Controllo aggiornamenti</b> all'apertura: legge solo un piccolo file pubblico, non invia dati e non scarica nulla da solo."], "tm": "Tempi misurati su una partita di quattro quarti (circa 80 minuti di gioco): preparazione circa 5 minuti, lavoro automatico circa 1 ora, esportazione HD circa 25 minuti.", "f2": ["<b>Periodi della partita:</b> crei la partita con data e numero di periodi (anche supplementari); ogni periodo ha la sua unit.", "<b>Partita intera:</b> BAKE unisce i quarti in un solo video, partita completa o highlights, con cartello di chiusura.", "<b>Cartelli:</b> inizio partita, inizio quarto con il punteggio, finale e statistiche, con data, loghi e colori delle squadre.", "<b>AUTOPILOT</b> segnala le clip doppie o sovrapposte.", "<b>Collegamento con Mantra 360:</b> lo apri dall'HUB e ogni quarto finisce nella sua unit.", "<b>GEOSCANNER</b> importa la calibrazione del quarto precedente; <b>REFINERY</b> ricarica da solo i dati nuovi."], "c1": "Cruscotto della partita", "c2": "Esporta il video HD", "c3": "Cartello di quarto", "c4": "Cartello sopra il video"}, "en": {"t": "What's new in 2.0 Alpha", "s": "The whole game, quarter by quarter.", "back": "Back to the site", "dl": "Download", "g": "User guide", "note": "Alpha version: keep a copy of your projects. Questions and reports in the GitHub Discussions.", "f1": ["<b>Whole game with Mantra for Basket.</b> Open Mantra 360 from the HUB and work quarter by quarter, with a dashboard showing each quarter's status.", "<b>Guided 6-step setup:</b> playing area, court, framings, scoreboard, quarters and start, in a single window.", "<b>Camera files (.insv) read directly.</b> An NVIDIA graphics card is needed; MP4 files also work with other cards, more slowly.", "<b>One pass per quarter:</b> working video, scoreboard video and analysis together. You can stop and resume; there is also an overnight mode.", "<b>Review by parts:</b> move through the game situations with keys and zoom on the part.", "<b>HD export</b> with three questions, optional camera motion blur, timeouts cut, and an <b>Export all quarters</b> button.", "<b>Update check</b> at startup: it only reads a small public file, sends no data and downloads nothing by itself."], "tm": "Times measured on a four-quarter game (about 80 minutes of play): setup about 5 minutes, automatic work about 1 hour, HD export about 25 minutes.", "f2": ["<b>Game periods:</b> create the game with a date and number of periods (overtime too); each period has its own unit.", "<b>Whole game:</b> BAKE joins the quarters into a single video, full game or highlights, with a closing card.", "<b>Cards:</b> game opening, quarter opening with score, final and statistics, with date, logos and team colours.", "<b>AUTOPILOT</b> flags duplicate or overlapping clips.", "<b>Link with Mantra 360:</b> open it from the HUB and each quarter lands in its unit.", "<b>GEOSCANNER</b> imports the previous quarter's calibration; <b>REFINERY</b> reloads new data by itself."], "c1": "Game dashboard", "c2": "HD export", "c3": "Quarter card", "c4": "Card over the video"}, "es": {"t": "Novedades de la 2.0 Alpha", "s": "El partido entero, cuarto a cuarto.", "back": "Volver al sitio", "dl": "Descargar", "g": "Guía de uso", "note": "Versión alpha: guarda una copia de tus proyectos. Preguntas y avisos en las Discussions de GitHub.", "f1": ["<b>Partido entero con Mantra for Basket.</b> Abre Mantra 360 desde el HUB y trabaja cuarto a cuarto, con un panel que muestra el estado de cada uno.", "<b>Preparación guiada en 6 pasos:</b> zona de juego, pista, encuadres, marcador, cuartos e inicio, en una sola ventana.", "<b>Archivos de la cámara (.insv) leídos directamente.</b> Hace falta una tarjeta gráfica NVIDIA; los MP4 funcionan también con otras tarjetas, más despacio.", "<b>Una sola pasada por cuarto:</b> vídeo de trabajo, vídeo del marcador y análisis juntos. Se puede interrumpir y reanudar; hay también modo nocturno.", "<b>Editor por partes:</b> te mueves entre las situaciones con teclas y zoom sobre la parte.", "<b>Exportación HD</b> con tres preguntas, desenfoque de movimiento opcional, tiempos muertos cortados y botón <b>Exportar todos los cuartos</b>.", "<b>Búsqueda de actualizaciones</b> al abrir: solo lee un pequeño archivo público, no envía datos ni descarga nada por sí solo."], "tm": "Tiempos medidos en un partido de cuatro cuartos (unos 80 minutos de juego): preparación unos 5 minutos, trabajo automático unos 60 minutos, exportación HD unos 25 minutos.", "f2": ["<b>Periodos del partido:</b> creas el partido con fecha y número de periodos (también prórrogas); cada periodo tiene su unit.", "<b>Partido entero:</b> BAKE une los cuartos en un solo vídeo, partido completo o resumen, con cartel de cierre.", "<b>Carteles:</b> inicio del partido, inicio de cuarto con el marcador, final y estadísticas, con fecha, logos y colores de los equipos.", "<b>AUTOPILOT</b> señala los clips duplicados o solapados.", "<b>Conexión con Mantra 360:</b> lo abres desde el HUB y cada cuarto va a su unit.", "<b>GEOSCANNER</b> importa la calibración del cuarto anterior; <b>REFINERY</b> recarga solo los datos nuevos."], "c1": "Panel del partido", "c2": "Exportar el vídeo HD", "c3": "Cartel de cuarto", "c4": "Cartel sobre el vídeo"}, "fr": {"t": "Nouveautés de la 2.0 Alpha", "s": "Le match entier, quart par quart.", "back": "Retour au site", "dl": "Télécharger", "g": "Guide d'utilisation", "note": "Version alpha : gardez une copie de vos projets. Questions et signalements dans les Discussions GitHub.", "f1": ["<b>Match entier avec Mantra for Basket.</b> Ouvrez Mantra 360 depuis le HUB et travaillez quart par quart, avec un tableau de bord qui montre l'état de chacun.", "<b>Préparation guidée en 6 étapes :</b> zone de jeu, terrain, cadrages, tableau d'affichage, quarts et lancement, dans une seule fenêtre.", "<b>Fichiers de la caméra (.insv) lus directement.</b> Une carte graphique NVIDIA est nécessaire ; les MP4 fonctionnent aussi avec d'autres cartes, plus lentement.", "<b>Un seul passage par quart :</b> vidéo de travail, vidéo du tableau et analyse ensemble. On peut interrompre et reprendre ; il y a aussi le mode nuit.", "<b>Éditeur par parties :</b> vous naviguez entre les situations avec les touches et le zoom sur la partie.", "<b>Export HD</b> avec trois questions, flou de mouvement facultatif, temps morts coupés et bouton <b>Exporter tous les quarts</b>.", "<b>Recherche de mises à jour</b> au démarrage : elle lit seulement un petit fichier public, n'envoie aucune donnée et ne télécharge rien toute seule."], "tm": "Durées mesurées sur un match de quatre quarts (environ 80 minutes de jeu) : préparation environ 5 minutes, travail automatique environ 1 heure, export HD environ 25 minutes.", "f2": ["<b>Périodes du match :</b> vous créez le match avec la date et le nombre de périodes (prolongations comprises) ; chaque période a son unit.", "<b>Match entier :</b> BAKE réunit les quarts en une seule vidéo, match complet ou résumé, avec un carton de fin.", "<b>Cartons :</b> début du match, début de quart avec le score, fin et statistiques, avec date, logos et couleurs des équipes.", "<b>AUTOPILOT</b> signale les clips en double ou qui se chevauchent.", "<b>Lien avec Mantra 360 :</b> vous l'ouvrez depuis le HUB et chaque quart va dans son unit.", "<b>GEOSCANNER</b> importe la calibration du quart précédent ; <b>REFINERY</b> recharge seul les nouvelles données."], "c1": "Tableau de bord du match", "c2": "Export vidéo HD", "c3": "Carton de quart", "c4": "Carton sur la vidéo"}};
function setL(l){if(!T[l])l="it";const x=T[l];document.documentElement.lang=l;
 const $=id=>document.getElementById(id);
 $("t").textContent=x.t;document.title="Mantra "+x.t;$("s").textContent=x.s;$("back").textContent="\u2190 "+x.back;
 $("l1").innerHTML=x.f1.map(i=>"<li>"+i+"</li>").join("");$("l2").innerHTML=x.f2.map(i=>"<li>"+i+"</li>").join("");
 $("tm").textContent=x.tm;
 for(const k of ["c1","c2","c3","c4"])$(k).textContent=x[k];
 for(const k of ["d1","d2"])$(k).textContent=x.dl;
 for(const k of ["g1","g2"])$(k).textContent=x.g;
 $("note").textContent=x.note;
 $("g2").href=l==="it"?"guida_mfb.html":"guida_mfb_"+l+".html";
 document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
 try{localStorage.setItem("lang",l)}catch(e){}}
document.getElementById("lang").addEventListener("click",e=>{if(e.target.dataset.l)setL(e.target.dataset.l)});
let q=new URLSearchParams(location.search).get("lang"),st=null;try{st=localStorage.getItem("lang")}catch(e){}
setL(q||st||((navigator.language||"it").slice(0,2)));
</script></body></html>
